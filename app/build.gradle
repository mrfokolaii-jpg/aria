plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mrfokolaii.aria'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mrfokolaii.aria2'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.3.0-gpu'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.7'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jsoup:jsoup:1.17.2'

    // On-device neural TTS
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'

    // On-device GGUF LLM (CPU fallback via llama.cpp)
    implementation 'dev.ffmpegkit-maintained:llama-android:0.1.1'

    // MediaPipe LLM Inference — free GPU acceleration (Vulkan/OpenCL via LiteRT)
    implementation 'com.google.mediapipe:tasks-genai:0.10.27'
}
