name: Build ARIA Android APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup JDK 17
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (runner preinstalled)
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            if [ -d "/usr/local/lib/android/sdk" ]; then
              export ANDROID_HOME="/usr/local/lib/android/sdk"
            elif [ -d "$HOME/android-sdk" ]; then
              export ANDROID_HOME="$HOME/android-sdk"
            fi
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List APK
        if: success()
        run: find app/build/outputs/apk -name "*.apk" -ls

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aria-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish Release with APK
        if: success()
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: build-${{ github.run_number }}
          name: "ARIA APK build ${{ github.run_number }}"
          body: |
            APK دیباگ از commit `${{ github.sha }}`
            فایل `app-debug.apk` را دانلود و نصب کنید.
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
