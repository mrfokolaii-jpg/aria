name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev patchelf git
          pip install --upgrade pip setuptools wheel cython kivy buildozer==0.45.0
        
      - name: Prepare Project Structure
        run: |
          mkdir -p src
          cp brain.py src/main.py || echo "print('Hello')" > src/main.py
          
      - name: Configure Buildozer
        run: |
          buildozer init
          sed -i 's/title = MyApplication/title = Aria/' buildozer.spec
          sed -i 's/package.name = org.kivy.androidapp/package.name = com.mrfokolaii.aria/' buildozer.spec
          sed -i 's/source.directory = .\/source/source.directory = ./src/' buildozer.spec
          # اضافه کردن کتابخانه‌های مورد نیاز به requirements
          sed -i '/^requirements = /c\requirements = python3,kivy,pillow,requests,pathlib2,certifi,chardet,idna,urllib3,six,setuptools,pyjnius,android' buildozer.spec
          
      - name: Build APK
        run: |
          buildozer android debug
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: aria-apk
          path: bin/*.apk
