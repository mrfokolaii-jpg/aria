name: Build Aria APK (Verified)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip build-essential libssl-dev libffi-dev \
            libtinfo5 libncurses5 libncursesw5 autoconf libtool pkg-config \
            zlib1g-dev cmake

      - name: Install correct pip dependencies
        run: |
          pip install --upgrade pip==23.3.1
          pip install setuptools==69.5.1 wheel cython==0.29.36 kivy==2.2.0 buildozer==1.6.0

      - name: Prepare src
        run: |
          mkdir -p src
          cp brain.py src/main.py || echo "print('Aria')" > src/main.py

      - name: Create buildozer.spec
        run: |
          cat <<SPEC > buildozer.spec
          [app]
          title = Aria
          package.name = aria
          package.domain = com.mrfokolaii
          source.dir = ./src
          version = 0.1
          requirements = python3,kivy,requests,pathlib2,certifi,chardet,idna,urllib3,six,android
          orientation = portrait
          android.api = 33
          android.minapi = 21
          android.ndk_api = 21
          SPEC

      - name: Build APK (with license auto-accept)
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-apk
          path: bin/*.apk
