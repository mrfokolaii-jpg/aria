name: Build Aria APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- مرحله ۱: ساختار پوشه‌بندی استاندارد Kivy ---
      - name: Setup Project Structure
        run: |
          mkdir -p src
          # اگر brain.py هست، آن را به main.py تبدیل کن (نقطه ورود اپ)
          if [ -f "brain.py" ]; then cp brain.py src/main.py; else echo "print('Aria Running')" > src/main.py; fi
          # فایل‌های دیگر (اگر هستند)
          for f in *.py; do [ "$f" != "brain.py" ] && cp "$f" src/ || true; done
          
      # --- مرحله ۲: نوشتن پیکربندی Buildozer ---
      - name: Create buildozer.spec
        run: |
          cat <<SPECFILE > buildozer.spec
          [app]
          title = Aria
          package.name = aria
          package.domain = com.mrfokolaii
          source.dir = ./src
          source.include_exts = py,png,jpg,kv,atlas,json,txt
          version = 0.1
          requirements = python3,kivy,requests,pathlib2,certifi,chardet,idna,urllib3,six,setuptools,pyjnius,android
          orientation = portrait
          fullscreen = 0
          android.api = 33
          android.minapi = 21
          android.ndk_api = 21
          SPECFILE

      # --- مرحله ۳: استفاده از اکشن رسمی Kivy برای بیلد ---
      - name: Build Android APK
        uses: kivy/kivy-action@v1
        with:
          recipe: buildozer-android-debug
          spec-file: buildozer.spec

      # --- مرحله ۴: آپلود خروجی ---
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-apk
          path: bin/*.apk
