name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev patchelf git
          pip install --upgrade pip setuptools wheel cython kivy buildozer==1.6.0
        
      - name: Prepare Project Structure
        run: |
          mkdir -p src
          cp brain.py src/main.py || echo "print('Hello')" > src/main.py
          
      - name: Write Custom Spec File
        run: |
          cat <<SPECFILE > buildozer.spec
          [app]
          title = Aria
          package.name = aria
          package.domain = org.mrfokolaii
          source.dir = ./src
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3,kivy,requests,pathlib2,certifi,chardet,idna,urllib3,six,setuptools,pyjnius,android
          orientation = portrait
          fullscreen = 0
          android.api = 33
          android.minapi = 21
          android.ndk_api = 21
          SPECFILE
          
      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
      - name: Build APK
        run: |
          buildozer android debug
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-apk
          path: bin/*.apk
