name: Android Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Get Date (for cache)
        id: get-date
        run: echo "date=$(date -u '+%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ steps.get-date.outputs.date }}

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt-get install -y \
            build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            libunwind-dev zlib1g-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev uuid-dev \
            zip unzip autoconf libtool pkg-config libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Prepare Project Structure
        run: |
          mkdir -p src
          if [ -f "brain.py" ]; then cp brain.py src/main.py; else echo "print('Aria Running')" > src/main.py; fi
          for f in *.py; do [ "$f" != "brain.py" ] && cp "$f" src/ || true; done

      - name: Create buildozer.spec
        run: |
          cat <<SPECFILE > buildozer.spec
          [app]
          title = Aria
          package.name = aria
          package.domain = com.mrfokolaii
          source.dir = ./src
          source.include_exts = py,png,jpg,kv,atlas,json,txt
          version = 0.1
          requirements = python3,kivy,requests,pathlib2,certifi,chardet,idna,urllib3,six,setuptools,pyjnius,android
          orientation = portrait
          fullscreen = 0
          android.api = 33
          android.minapi = 21
          android.ndk_api = 21
          SPECFILE

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-apk
          path: bin/*.apk
          retention-days: 7
